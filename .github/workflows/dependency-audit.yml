name: Dependency advisory audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-advisory-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Report dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - name: Publish issue with package, current version, patched version, and link only
        env:
          GH_REPOSITORY: ${{github.repository}}
          GH_TOKEN: ${{github.token}}
        run: node scripts/dependency-audit-issue.mjs
