name: Security policy

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  security:
    name: Security policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
      - name: Install source dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix packages/gpt-codex-hwp
      - name: Install runtime dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix plugins/gpt-codex-hwp --omit=dev
      - name: Scan public tree
        run: npm run security:scan-tree
      - name: Scan every reachable Git object and identity
        run: npm run security:scan-history
      - name: Audit source production dependencies
        run: npm audit --omit=dev --prefix packages/gpt-codex-hwp
      - name: Audit runtime production dependencies
        run: npm audit --omit=dev --prefix plugins/gpt-codex-hwp
      - name: Verify projected runtime is current
        run: npm run runtime:check
      - name: Configure neutral release identity
        run: |
          git config --local user.name "Gpt_Codex_HWP contributors"
          git config --local user.email "224273819+Burntgogi@users.noreply.github.com"
      - name: Build candidate artifacts
        run: npm run release:artifacts -- --output release-artifacts
      - name: Verify candidate artifacts
        run: npm run verify:release-artifacts -- --artifacts release-artifacts
      - name: Reject generated repository changes
        run: git diff --exit-code -- .
