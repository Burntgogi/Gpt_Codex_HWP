name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      HWP_REQUIRE_RHWP: "1"
      HWP_BENCH_LARGE: "1"
      HWP_BENCH_REQUIRE_LARGE: "1"
      HWP_BENCH_LARGE_EVIDENCE: ".superpowers/benchmarks/release-large.json"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Assert Windows x64 runtime
        run: node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
      - name: Assert exact feature head
        run: node -e "const { execFileSync } = require('node:child_process'); if (process.env.EXPECTED_SOURCE_REPOSITORY !== 'Burntgogi/Gpt_Codex_HWP') process.exit(1); if (process.env.EXPECTED_HEAD_SHA !== execFileSync('git', ['rev-parse', 'HEAD'], { encoding:'utf8' }).trim()) process.exit(1)"
      - name: Configure neutral release identity
        run: |
          git config --local user.name "Gpt_Codex_HWP contributors"
          git config --local user.email "224273819+Burntgogi@users.noreply.github.com"
          git remote set-url origin "https://github.com/Burntgogi/Gpt_Codex_HWP.git"
      - name: Fresh source dependency install
        run: npm ci --ignore-scripts --prefix packages/gpt-codex-hwp
      - name: Fresh runtime dependency install
        run: npm ci --ignore-scripts --prefix plugins/gpt-codex-hwp --omit=dev
      - name: Build Windows diagnostic prerequisite
        run: npm --prefix packages/gpt-codex-hwp run build
      - name: Classify hosted Windows supervisor boundary
        run: npm --prefix packages/gpt-codex-hwp run diagnose:hosted -- --windows-supervisor
      - name: Generate fresh large-document evidence
        run: npm --prefix packages/gpt-codex-hwp run benchmark:documents -- --sizes 100,256,512 --output .superpowers/benchmarks/release-large.json
      - name: Run full release gate and create platform receipt
        id: windows_release_gate
        run: node scripts/platform-receipts.mjs create
      - name: Diagnose failed Windows Node release gate
        if: ${{ failure() && steps.windows_release_gate.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/windows-node-tests-diagnostic.mjs
      - name: Independently verify platform receipt
        run: node scripts/platform-receipts.mjs verify
      - name: Checksum platform receipt
        run: node scripts/platform-receipts.mjs checksum
      - name: Reject generated repository changes
        run: git diff --exit-code -- .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpt-codex-hwp-windows-x64-platform-receipt
          path: |
            release-receipts/platform-receipt.json
            release-receipts/platform-receipt.sha256
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS arm64
    runs-on: macos-15
    permissions:
      contents: read
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      HWP_REQUIRE_RHWP: "1"
      HWP_BENCH_LARGE: "1"
      HWP_BENCH_REQUIRE_LARGE: "1"
      HWP_BENCH_LARGE_EVIDENCE: ".superpowers/benchmarks/release-large.json"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Assert macOS arm64 runtime
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - name: Assert exact feature head
        run: node -e "const { execFileSync } = require('node:child_process'); if (process.env.EXPECTED_SOURCE_REPOSITORY !== 'Burntgogi/Gpt_Codex_HWP') process.exit(1); if (process.env.EXPECTED_HEAD_SHA !== execFileSync('git', ['rev-parse', 'HEAD'], { encoding:'utf8' }).trim()) process.exit(1)"
      - name: Configure neutral release identity
        run: |
          git config --local user.name "Gpt_Codex_HWP contributors"
          git config --local user.email "224273819+Burntgogi@users.noreply.github.com"
          git remote set-url origin "https://github.com/Burntgogi/Gpt_Codex_HWP.git"
      - name: Fresh source dependency install
        run: npm ci --ignore-scripts --prefix packages/gpt-codex-hwp
      - name: Fresh runtime dependency install
        run: npm ci --ignore-scripts --prefix plugins/gpt-codex-hwp --omit=dev
      - name: Build macOS diagnostic prerequisite
        run: npm --prefix packages/gpt-codex-hwp run build
      - name: Classify hosted macOS worker boundaries
        run: npm --prefix packages/gpt-codex-hwp run diagnose:hosted -- --mac-worker
      - name: Generate fresh large-document evidence
        run: npm --prefix packages/gpt-codex-hwp run benchmark:documents -- --sizes 100,256,512 --output .superpowers/benchmarks/release-large.json
      - name: Run safe macOS POSIX controls
        run: node scripts/macos-posix-controls.mjs
      - name: Run full release gate and create platform receipt
        id: macos_release_gate
        run: node scripts/platform-receipts.mjs create
      - name: Diagnose failed macOS Node release gate
        if: ${{ failure() && steps.macos_release_gate.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/macos-node-tests-diagnostic.mjs
      - name: Independently verify platform receipt
        run: node scripts/platform-receipts.mjs verify
      - name: Checksum platform receipt
        run: node scripts/platform-receipts.mjs checksum
      - name: Reject generated repository changes
        run: git diff --exit-code -- .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpt-codex-hwp-macos-arm64-platform-receipt
          path: |
            release-receipts/platform-receipt.json
            release-receipts/platform-receipt.sha256
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux lifecycle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - name: Assert Linux x64 runtime
        run: node -e "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
      - name: Assert exact feature head
        run: node -e "const { execFileSync } = require('node:child_process'); if (process.env.EXPECTED_HEAD_SHA !== execFileSync('git', ['rev-parse', 'HEAD'], { encoding:'utf8' }).trim()) process.exit(1)"
      - name: Fresh source dependency install
        run: npm ci --ignore-scripts --prefix packages/gpt-codex-hwp
      - name: Build package
        run: npm --prefix packages/gpt-codex-hwp run build
      - name: Run bounded lifecycle focused tests
        run: npm --prefix packages/gpt-codex-hwp run test:focused -- tests/document-process-registration.test.ts tests/document-child-client.test.ts tests/benchmark-policy.test.ts
