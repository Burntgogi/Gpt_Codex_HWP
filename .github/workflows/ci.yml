name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      HWP_REQUIRE_RHWP: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Assert Windows x64 runtime
        run: node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
      - name: Assert exact feature head
        run: node -e "const { execFileSync } = require('node:child_process'); if (process.env.EXPECTED_SOURCE_REPOSITORY !== 'Burntgogi/Gpt_Codex_HWP') process.exit(1); if (process.env.EXPECTED_HEAD_SHA !== execFileSync('git', ['rev-parse', 'HEAD'], { encoding:'utf8' }).trim()) process.exit(1)"
      - name: Fresh source dependency install
        timeout-minutes: 10
        run: npm ci --ignore-scripts --prefix packages/gpt-codex-hwp
      - name: Build source package
        timeout-minutes: 10
        run: npm --prefix packages/gpt-codex-hwp run build
      - name: Verify generated runtime projection
        timeout-minutes: 5
        run: npm run runtime:check
      - name: Fresh runtime production install
        timeout-minutes: 10
        run: npm ci --ignore-scripts --prefix plugins/gpt-codex-hwp --omit=dev
      - name: Verify bounded installed runtime smoke
        timeout-minutes: 10
        run: npm run verify:runtime-smoke
      - name: Classify hosted Windows supervisor boundary
        timeout-minutes: 10
        run: npm --prefix packages/gpt-codex-hwp run diagnose:hosted -- --windows-supervisor
      - name: Run Windows PR Node profile
        id: windows_node
        timeout-minutes: 30
        run: npm --prefix packages/gpt-codex-hwp run test:pr
      - name: Run Windows Python tests
        id: windows_python
        timeout-minutes: 15
        run: npm run test:python
      - name: Run 10 MiB document smoke
        timeout-minutes: 15
        run: npm --prefix packages/gpt-codex-hwp run benchmark:documents -- --sizes 10 --output .superpowers/benchmarks/pr-10.json
      - name: Reject generated repository changes
        run: git diff --exit-code -- .
      - name: Diagnose failed Windows Node PR tests
        if: ${{ failure() && steps.windows_node.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/windows-node-tests-diagnostic.mjs --profile=pr
      - name: Diagnose failed Windows Python tests
        if: ${{ failure() && steps.windows_python.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/python-tests-diagnostic.mjs

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      HWP_REQUIRE_RHWP: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Assert macOS arm64 runtime
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - name: Assert exact feature head
        run: node -e "const { execFileSync } = require('node:child_process'); if (process.env.EXPECTED_SOURCE_REPOSITORY !== 'Burntgogi/Gpt_Codex_HWP') process.exit(1); if (process.env.EXPECTED_HEAD_SHA !== execFileSync('git', ['rev-parse', 'HEAD'], { encoding:'utf8' }).trim()) process.exit(1)"
      - name: Fresh source dependency install
        timeout-minutes: 10
        run: npm ci --ignore-scripts --prefix packages/gpt-codex-hwp
      - name: Build source package
        timeout-minutes: 10
        run: npm --prefix packages/gpt-codex-hwp run build
      - name: Verify generated runtime projection
        timeout-minutes: 5
        run: npm run runtime:check
      - name: Fresh runtime production install
        timeout-minutes: 10
        run: npm ci --ignore-scripts --prefix plugins/gpt-codex-hwp --omit=dev
      - name: Verify bounded installed runtime smoke
        timeout-minutes: 10
        run: npm run verify:runtime-smoke
      - name: Classify hosted macOS worker boundaries
        timeout-minutes: 10
        run: npm --prefix packages/gpt-codex-hwp run diagnose:hosted -- --mac-worker
      - name: Run macOS PR Node profile
        id: macos_node
        timeout-minutes: 30
        run: npm --prefix packages/gpt-codex-hwp run test:pr:macos
      - name: Run macOS Python tests
        id: macos_python
        timeout-minutes: 15
        run: npm run test:python
      - name: Run 10 MiB document smoke
        timeout-minutes: 15
        run: npm --prefix packages/gpt-codex-hwp run benchmark:documents -- --sizes 10 --output .superpowers/benchmarks/pr-10.json
      - name: Reject generated repository changes
        run: git diff --exit-code -- .
      - name: Diagnose failed macOS Node PR tests
        if: ${{ failure() && steps.macos_node.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/macos-node-tests-diagnostic.mjs --profile=pr-macos
      - name: Diagnose failed macOS Python tests
        if: ${{ failure() && steps.macos_python.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/python-tests-diagnostic.mjs

  linux:
    name: Linux lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - name: Assert Linux x64 runtime
        run: node -e "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
      - name: Assert exact feature head
        run: node -e "const { execFileSync } = require('node:child_process'); if (process.env.EXPECTED_HEAD_SHA !== execFileSync('git', ['rev-parse', 'HEAD'], { encoding:'utf8' }).trim()) process.exit(1)"
      - name: Fresh source dependency install
        timeout-minutes: 10
        run: npm ci --ignore-scripts --prefix packages/gpt-codex-hwp
      - name: Build package
        timeout-minutes: 10
        run: npm --prefix packages/gpt-codex-hwp run build
      - name: Run bounded lifecycle focused tests
        timeout-minutes: 20
        run: npm --prefix packages/gpt-codex-hwp run test:focused -- tests/document-process-registration.test.ts tests/document-child-client.test.ts tests/benchmark-policy.test.ts
