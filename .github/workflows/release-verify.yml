name: Release candidate verification

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable release tag (for example, v0.2.1)
        required: true
        type: string
      expected_release_sha:
        description: Exact 40-character commit SHA referenced by the tag
        required: true
        type: string
      release_version:
        description: SemVer without the v prefix (for example, 0.2.1)
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_ref }}-${{ inputs.expected_release_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build verified v${{ inputs.release_version }} candidate
    runs-on: windows-2025
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      RELEASE_REF: ${{ inputs.release_ref }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Assert Windows x64 runtime
        run: node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
      - name: Assert exact immutable release tag
        run: node -e "const { execFileSync } = require('node:child_process'); const s = process.env.EXPECTED_RELEASE_SHA; const r = process.env.RELEASE_REF; const v = process.env.RELEASE_VERSION; const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding:'utf8' }).trim(); const tag = execFileSync('git', ['tag', '--points-at', 'HEAD', '--list', r], { encoding:'utf8' }).trim(); if (!/^[0-9a-f]{40}$/.test(s) || !/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(r) || r !== 'v' + v || s !== head || tag !== r) process.exit(1)"
      - name: Canonicalize Windows temporary root
        run: node -e "const fs=require('node:fs'); const os=require('node:os'); const path=require('node:path'); const temp=fs.realpathSync.native(os.tmpdir()); const out=process.env.GITHUB_ENV; if (!path.isAbsolute(temp) || /[\r\n]/u.test(temp) || !path.isAbsolute(out) || /[\r\n]/u.test(out)) process.exit(1); fs.appendFileSync(out, 'TEMP=' + temp + '\nTMP=' + temp + '\n', 'utf8')"
      - name: Pin npm
        run: |
          npm install --global npm@10.9.7 --ignore-scripts
          if ((npm --version) -ne "10.9.7") { exit 1 }
      - name: Install source dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix packages/gpt-codex-hwp
      - name: Configure neutral release identity
        run: |
          git config --local user.name "Gpt_Codex_HWP contributors"
          git config --local user.email "224273819+Burntgogi@users.noreply.github.com"
          git remote set-url origin "https://github.com/Burntgogi/Gpt_Codex_HWP.git"
      - name: Run release 100 MiB production-path smoke
        id: large
        timeout-minutes: 30
        run: node scripts/installed-runtime-smoke.mjs --large-detect 100
      - name: Run the complete fail-closed release gate
        id: release_gate
        run: npm run release:verify
      - name: Diagnose failed installed-runtime smoke tests
        if: ${{ failure() && steps.release_gate.outcome == 'failure' }}
        timeout-minutes: 5
        run: node --test --test-concurrency=1 tests/installed-runtime-smoke.test.mjs
      - name: Build checksummed candidate outputs
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/gpt-codex-hwp-release-artifacts
        run: npm run release:artifacts -- --output "$env:RELEASE_ARTIFACT_DIR"
      - name: Verify candidate outputs
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/gpt-codex-hwp-release-artifacts
        run: npm run verify:release-artifacts -- --artifacts "$env:RELEASE_ARTIFACT_DIR"
      - name: Require checksum manifest and clean tree
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/gpt-codex-hwp-release-artifacts
        run: |
          node -e "require('node:fs').accessSync(require('node:path').join(process.env.RELEASE_ARTIFACT_DIR, 'SHA256SUMS'))"
          git diff --exit-code -- .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: gpt-codex-hwp-v${{ inputs.release_version }}-candidate
          path: ${{ runner.temp }}/gpt-codex-hwp-release-artifacts/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest verified v${{ inputs.release_version }} subjects
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.0
        with:
          name: gpt-codex-hwp-v${{ inputs.release_version }}-candidate
          path: release-artifacts
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.0
        with:
          subject-path: release-artifacts/gpt-codex-hwp-${{ inputs.release_version }}.zip
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.0
        with:
          subject-path: release-artifacts/gpt-codex-hwp-${{ inputs.release_version }}.spdx.json
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.0
        with:
          subject-path: release-artifacts/provenance.json
